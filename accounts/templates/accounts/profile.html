{% extends 'base.html' %}

{% block content %}

<div class="container" style="max-width: 800px; padding: 80px 20px;">

    <h1>My Profile</h1>

    <p>
        <strong>Name:</strong>
        {{ user.first_name }} {{ user.last_name }}
    </p>

    <p>
        <strong>Username:</strong>
        {{ user.username }}
    </p>

    <p>
        <strong>Email:</strong>
        {{ user.email }}
    </p>

    <a href="{% url 'accounts:dashboard' %}">
        Back to Dashboard
    </a>

</div>

{% endblock %}
