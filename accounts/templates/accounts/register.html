{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 600px; padding: 80px 20px;">
    <h1>Create an account</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create account
        </button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'accounts:login' %}">Log in</a>
    </p>
</div>
{% endblock %}
